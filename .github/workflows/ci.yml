name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The integration job talks to live Pressbooks networks. A nightly run
  # catches an endpoint that has moved or gone dead even when nobody is
  # pushing.
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go vet -tags=integration ./...
      - run: go build ./...
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

  integration:
    name: Live integration tests
    runs-on: ubuntu-latest
    # A fork's pull request should not be gated on third-party availability.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Integration tests against live Pressbooks networks
        run: go test ./... -tags=integration -count=1 -v
        timeout-minutes: 10
